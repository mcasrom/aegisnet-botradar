<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AegisNet · En mantenimiento</title>
<meta name="description" content="AegisNet-BotRadar está en mantenimiento. Volvemos pronto.">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#070b18;--card:#101b33;--line:#1c2a47;--fg:#e8eefb;--mut:#8ba0c4;--accent:#22d3ee}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 80% -10%,rgba(34,211,238,.08),transparent),var(--bg);color:var(--fg);margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.icon{font-size:56px;margin-bottom:16px}
h1{font-size:30px;margin:0 0 8px}
p{color:var(--mut);font-size:16px;max-width:480px;margin:0 0 24px}
.badge{display:inline-block;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:var(--accent);font-size:13px;font-weight:700;padding:6px 16px;border-radius:30px;margin-bottom:20px}
.spinner{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{margin-top:40px;color:var(--mut);font-size:12.5px}
footer a{color:var(--accent);text-decoration:none}
</style></head><body>
<div class="icon">🛠️</div>
<span class="badge">AegisNet-BotRadar</span>
<div class="spinner"></div>
<h1>En mantenimiento</h1>
<p>Estamos actualizando la plataforma. No te preocupes: los datos no se pierden. Vuelve en unos minutos.</p>
<footer>
  AegisNet · <a href="mailto:aegis.info@viajeinteligencia.com">aegis.info@viajeinteligencia.com</a><br>
  Los servidores los paga su autor.
</footer>
</body></html>
